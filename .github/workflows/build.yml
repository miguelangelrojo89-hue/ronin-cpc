name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sdcc
      - run: python3 build.py test
      - run: python3 build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ronin-cpc
          path: |
            ronin.dsk
            RONIN.BIN
            ronin.map
